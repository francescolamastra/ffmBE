spring:
  datasource:
    driver-class-name: org.h2.Driver
    #url: jdbc:h2:mem:ffm;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    url: jdbc:h2:file:./data/ffm;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
  sql:
    init:
      #mode: never
      #schema-locations: classpath:schema-h2.sql
      mode: always
      data-locations: classpath:clear-batch-tables.sql
  h2:
    console:
      enabled: true